name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    permissions:
      contents: write # 给予 Release 上传权限

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: datagenerator-linux-x64
          - os: macos-latest
            artifact_name: datagenerator-macos-x64
          - os: windows-latest
            artifact_name: datagenerator-windows-x64.exe

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Run Tests
        working-directory: build
        run: ctest --output-on-failure -C Release

      # ------------------ 重命名产物 ------------------
      - name: Prepare Artifact (Windows)
        if: runner.os == 'Windows'
        run: |
          Get-ChildItem -Path build -Filter "datagenerator.exe" -Recurse | Copy-Item -Destination "${{ matrix.artifact_name }}"

      - name: Prepare Artifact (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          cp $(find build -name datagenerator -type f) ./${{ matrix.artifact_name }}

      # ------------------ 上传到 Release ------------------
      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ matrix.artifact_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}